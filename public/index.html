<html lang="pt-BR">

        }

// ==========================================================
// ESTADO
// ==========================================================

let sala =
    "";

let streamLocal =
    null;

let peer =

let socketConectado =
    false;

let candidatosPendentes =

let fonteEscolhida =
    null;


// ==========================================================
// ÁUDIO NATIVO

let audioContextNativo =

let audioProcessor =
    null;

let audioDestino =
    null;

let audioGanhoMudo =
    null;

let audioTrackNativo =
    null;

let filaAudio =

let amostrasNaFila =
    0;

let restoPCM =
    new Uint8Array(0);

let removerListenerPCM =
    null;

let removerListenerErro =
    null;

let removerListenerEncerrado =
    null;

let audioNativoAtivo =

// ==========================================================
// WEBRTC
// ==========================================================

const configuracaoWebRTC = {

        {

        },

        {

                "stun:stun1.l.google.com:19302"

};

const socket =

socket.on(

    () => {

);


socket.on(

    motivo => {

        console.log(

        );

            "Reconectando ao servidor...";

    }
);


socket.on(
    "connect_error",
    erro => {

        socketConectado =

        console.error(
            "Erro ao conectar Socket:",
            erro.message
        );


        statusTexto.innerText =
            "Tentando conectar ao servidor...";

);


statusTexto.innerText =
    "Conectando ao servidor...";

socket.connect();


// ==========================================================
// ENTRAR NA SALA PELO LINK

const parametrosURL =

const salaDoLink =

if (

) {

}

    compartilhar.style.display =

};


// ==========================================================
// COPIAR LINK

copiar.onclick =
async () => {

            "✅ Copiado";

};


// ==========================================================

// ==========================================================

compartilhar.onclick =
async () => {

    if (

    ) {

    }


    await compartilharNavegador();

};


// ==========================================================
// SELETOR DO ELECTRON
// ==========================================================

async function abrirSeletorElectron() {

    modalFontes.style.display =
        "flex";


    listaFontes.innerHTML =
        "Carregando janelas...";


    try {

        const fontes =

                .electronAPI

                `;


                card.onclick =

                    const selecionada =

                            .electronAPI

                            );


                    if (

                    ) {

                    );

        );

    }
    catch (
        erro
    ) {

        console.error(
            erro
        );


        listaFontes.innerHTML =
            "Erro ao carregar as janelas.";

    }

}


// ==========================================================
// RECEBER PCM
// ==========================================================

function receberPCM(
    dados
) {

    if (
        !audioNativoAtivo
    ) {

        return;

    }


    let bytes;


    if (
        dados instanceof Uint8Array
    ) {

        bytes =
            dados;

    }
    else if (
        dados
        &&
        dados.buffer
    ) {

        bytes =
            new Uint8Array(
                dados.buffer,
                dados.byteOffset || 0,
                dados.byteLength || dados.length
            );

    }
    else {

        bytes =
            new Uint8Array(
                dados
            );

    }


    if (
        restoPCM.length > 0
    ) {

        const combinado =
            new Uint8Array(
                restoPCM.length
                +
                bytes.length
            );


        combinado.set(
            restoPCM,
            0
        );


        combinado.set(
            bytes,
            restoPCM.length
        );


        bytes =
            combinado;


        restoPCM =
            new Uint8Array(0);

    }


    const bytesPorFrame =
        4;


    const tamanhoUtil =
        bytes.length
        -
        (
            bytes.length
            %
            bytesPorFrame
        );


    if (
        tamanhoUtil < bytes.length
    ) {

        restoPCM =
            bytes.slice(
                tamanhoUtil
            );

    }


    if (
        tamanhoUtil === 0
    ) {

        return;

    }


    const quantidadeFrames =
        tamanhoUtil
        /
        bytesPorFrame;


    const esquerda =
        new Float32Array(
            quantidadeFrames
        );


    const direita =
        new Float32Array(
            quantidadeFrames
        );


    const view =
        new DataView(
            bytes.buffer,
            bytes.byteOffset,
            tamanhoUtil
        );


    for (
        let i = 0;
        i < quantidadeFrames;
        i++
    ) {

        const offset =
            i * 4;


        const amostraEsquerda =
            view.getInt16(
                offset,
                true
            );


        const amostraDireita =
            view.getInt16(
                offset + 2,
                true
            );


        esquerda[i] =
            amostraEsquerda
            /
            32768;


        direita[i] =
            amostraDireita
            /
            32768;

    }


    filaAudio.push({

        esquerda:
            esquerda,

        direita:
            direita,

        offset:
            0

    });


    amostrasNaFila +=
        quantidadeFrames;


    /*
    Evita que um atraso grande acumule
    vários segundos de áudio.
    */

    if (
        amostrasNaFila >
        96000
    ) {

        while (
            filaAudio.length > 0
            &&
            amostrasNaFila >
            48000
        ) {

            const antigo =
                filaAudio.shift();


            amostrasNaFila -=
                antigo.esquerda.length
                -
                antigo.offset;

        }

    }

}


// ==========================================================
// PROCESSADOR WEB AUDIO
// ==========================================================

function processarAudio(
    evento
) {

    const saidaEsquerda =
        evento.outputBuffer
            .getChannelData(0);


    const saidaDireita =
        evento.outputBuffer
            .getChannelData(1);


    saidaEsquerda.fill(
        0
    );


    saidaDireita.fill(
        0
    );


    let posicaoSaida =
        0;


    while (
        posicaoSaida <
            saidaEsquerda.length
        &&
        filaAudio.length >
            0
    ) {

        const bloco =
            filaAudio[0];


        const disponivel =
            bloco.esquerda.length
            -
            bloco.offset;


        const necessario =
            saidaEsquerda.length
            -
            posicaoSaida;


        const copiar =
            Math.min(
                disponivel,
                necessario
            );


        saidaEsquerda.set(
            bloco.esquerda.subarray(
                bloco.offset,
                bloco.offset + copiar
            ),
            posicaoSaida
        );


        saidaDireita.set(
            bloco.direita.subarray(
                bloco.offset,
                bloco.offset + copiar
            ),
            posicaoSaida
        );


        bloco.offset +=
            copiar;


        posicaoSaida +=
            copiar;


        amostrasNaFila -=
            copiar;


        if (
            bloco.offset >=
            bloco.esquerda.length
        ) {

            filaAudio.shift();

        }

    }

}


// ==========================================================
// PREPARAR ÁUDIO NATIVO
// ==========================================================

async function iniciarAudioNativo() {

    await encerrarAudioNativo(
        true
    );


    audioNativoAtivo =
        true;


    filaAudio =
        [];


    amostrasNaFila =
        0;


    restoPCM =
        new Uint8Array(0);


    const AudioContextClasse =
        window.AudioContext
        ||
        window.webkitAudioContext;


    audioContextNativo =
        new AudioContextClasse({

            sampleRate:
                48000

        });


    audioDestino =
        audioContextNativo
            .createMediaStreamDestination();


    /*
    ScriptProcessor é usado aqui como ponte
    PCM -> MediaStream.
    */

    audioProcessor =
        audioContextNativo
            .createScriptProcessor(
                2048,
                0,
                2
            );


    audioProcessor.onaudioprocess =
        processarAudio;


    /*
    Saída usada pelo WebRTC.
    */

    audioProcessor.connect(
        audioDestino
    );


    /*
    Também conectamos ao contexto local com
    ganho zero para manter o processador ativo,
    sem reproduzir som no computador.
    */

    audioGanhoMudo =
        audioContextNativo
            .createGain();


    audioGanhoMudo.gain.value =
        0;


    audioProcessor.connect(
        audioGanhoMudo
    );


    audioGanhoMudo.connect(
        audioContextNativo.destination
    );


    removerListenerPCM =
        window.electronAPI
            .aoReceberAudioPCM(
                receberPCM
            );


    removerListenerErro =
        window.electronAPI
            .aoErroAudio(
                mensagem => {

                    console.error(
                        "Erro no áudio nativo:",
                        mensagem
                    );


                    if (
                        souTransmissor
                    ) {

                        statusTexto.innerText =
                            "⚠️ Vídeo transmitindo, mas ocorreu um erro no áudio.";

                    }

                }
            );


    removerListenerEncerrado =
        window.electronAPI
            .aoEncerrarAudio(
                codigo => {

                    console.log(
                        "Captura de áudio encerrada:",
                        codigo
                    );


                    if (
                        audioNativoAtivo
                        &&
                        souTransmissor
                    ) {

                        statusTexto.innerText =
                            "⚠️ A captura de áudio do aplicativo foi encerrada.";

                    }

                }
            );


    await audioContextNativo.resume();


    const resultado =
        await window
            .electronAPI
            .iniciarAudioAplicativo();


    if (
        !resultado
        ||
        !resultado.ok
    ) {

        const mensagem =
            resultado
            &&
            resultado.erro
                ? resultado.erro
                : "Não foi possível iniciar o áudio.";


        console.error(
            mensagem
        );


        await encerrarAudioNativo(
            true
        );


        return {

            ok:
                false,

            erro:
                mensagem

        };

    }


    audioTrackNativo =
        audioDestino
            .stream
            .getAudioTracks()[0];


    if (
        !audioTrackNativo
    ) {

        await encerrarAudioNativo(
            true
        );


        return {

            ok:
                false,

            erro:
                "A faixa de áudio não foi criada."

        };

    }


    audioTrackNativo.enabled =
        true;


    console.log(
        "Áudio exclusivo iniciado para PID:",
        resultado.pid
    );


    return {

        ok:
            true,

        track:
            audioTrackNativo,

        pid:
            resultado.pid,

        nome:
            resultado.nome

    };

}


// ==========================================================
// ENCERRAR ÁUDIO NATIVO
// ==========================================================

async function encerrarAudioNativo(
    pararHelper = true
) {

    audioNativoAtivo =
        false;


    if (
        removerListenerPCM
    ) {

        removerListenerPCM();

        removerListenerPCM =
            null;

    }


    if (
        removerListenerErro
    ) {

        removerListenerErro();

        removerListenerErro =
            null;

    }


    if (
        removerListenerEncerrado
    ) {

        removerListenerEncerrado();

        removerListenerEncerrado =
            null;

    }


    if (
        audioProcessor
    ) {

        try {

            audioProcessor.disconnect();

        }
        catch {
        }


        audioProcessor.onaudioprocess =
            null;


        audioProcessor =
            null;

    }


    if (
        audioGanhoMudo
    ) {

        try {

            audioGanhoMudo.disconnect();

        }
        catch {
        }


        audioGanhoMudo =
            null;

    }


    if (
        audioDestino
    ) {

        try {

            audioDestino.disconnect();

        }
        catch {
        }


        audioDestino =
            null;

    }


    if (
        audioTrackNativo
    ) {

        try {

            audioTrackNativo.stop();

        }
        catch {
        }


        audioTrackNativo =
            null;

    }


    filaAudio =
        [];


    amostrasNaFila =
        0;


    restoPCM =
        new Uint8Array(0);


    if (
        audioContextNativo
    ) {

        try {

            await audioContextNativo.close();

        }
        catch {
        }


        audioContextNativo =
            null;

    }


    if (
        pararHelper
        &&
        estouNoElectron
        &&
        window.electronAPI
            .pararAudioAplicativo
    ) {

        try {

            await window
                .electronAPI
                .pararAudioAplicativo();

        }
        catch (
            erro
        ) {

            console.log(
                "Erro ao parar áudio:",
                erro
            );

        }

    }

}


// ==========================================================
// CAPTURA ELECTRON
// ==========================================================

async function iniciarElectron() {

    try {

        const qualidade =
            Number(
                document
                    .getElementById(
                        "qualidade"
                    )
                    .value
            );


        const fps =
            Number(
                document
                    .getElementById(
                        "fps"
                    )
                    .value
            );


        const usarAudio =
            usarAudioCheckbox
                .checked;


        const largura =
            qualidade === 1080
                ? 1920
                : 1280;


        const altura =
            qualidade === 1080
                ? 1080
                : 720;


        /*
        No Electron, o getDisplayMedia pega
        SOMENTE vídeo.

        O áudio vem do helper nativo.
        */

        streamLocal =
            await navigator
                .mediaDevices
                .getDisplayMedia({

                    video: {

                        width: {
                            ideal:
                                largura
                        },

                        height: {
                            ideal:
                                altura
                        },

                        frameRate: {
                            ideal:
                                fps,

                            max:
                                fps
                        }

                    },

                    audio:
                        false

                });


        /*
        Se o usuário marcou áudio,
        inicia a captura exclusiva.
        */

        if (
            usarAudio
        ) {

            if (
                fonteEscolhida
                &&
                String(
                    fonteEscolhida.id
                ).startsWith(
                    "window:"
                )
            ) {

                statusTexto.innerText =
                    "🔊 Iniciando áudio do aplicativo...";


                const audio =
                    await iniciarAudioNativo();


                if (
                    audio.ok
                    &&
                    audio.track
                ) {

                    streamLocal.addTrack(
                        audio.track
                    );


                    console.log(
                        "Faixa de áudio adicionada ao MediaStream."
                    );

                }
                else {

                    statusTexto.innerText =
                        "⚠️ Compartilhando vídeo sem áudio: "
                        +
                        audio.erro;

                }

            }
            else {

                statusTexto.innerText =
                    "⚠️ Áudio exclusivo exige uma janela de aplicativo.";

            }

        }


        await prepararTransmissao();

    }
    catch (
        erro
    ) {

        console.error(
            erro
        );


        await encerrarAudioNativo(
            true
        );


        if (
            streamLocal
        ) {

            streamLocal
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );


            streamLocal =
                null;

        }


        statusTexto.innerText =
            "Erro ao iniciar a transmissão.";

    }

}


// ==========================================================
// CAPTURA PELO NAVEGADOR
// ==========================================================

async function compartilharNavegador() {

    try {

        streamLocal =
            await navigator
                .mediaDevices
                .getDisplayMedia({

                    video: {

                        width: {
                            ideal:
                                1920
                        },

                        height: {
                            ideal:
                                1080
                        },

                        frameRate: {
                            ideal:
                                30,

                            max:
                                30
                        }

                    },

                    audio:
                        true

                });


        await prepararTransmissao();

    }
    catch (
        erro
    ) {

        console.error(
            erro
        );


        statusTexto.innerText =
            "Compartilhamento cancelado.";

    }

}


// ==========================================================
// PREPARAR TRANSMISSÃO
// ==========================================================

async function prepararTransmissao() {

    video.muted =
        true;


    video.srcObject =
        streamLocal;


    const trackVideo =
        streamLocal
            .getVideoTracks()[0];


    if (
        trackVideo
    ) {

        trackVideo.contentHint =
            "detail";

    }


    criarPeer();


    for (
        const track
        of streamLocal.getTracks()
    ) {

        const sender =
            peer.addTrack(
                track,
                streamLocal
            );


        if (
            track.kind ===
            "video"
        ) {

            try {

                const parametros =
                    sender.getParameters();


                if (
                    !parametros.encodings
                    ||
                    parametros.encodings.length ===
                    0
                ) {

                    parametros.encodings =
                        [{}];

                }


                parametros
                    .encodings[0]
                    .maxBitrate =
                        8000000;


                await sender
                    .setParameters(
                        parametros
                    );

            }
            catch {

                console.log(
                    "Bitrate automático."
                );

            }

        }

    }


    await enviarOffer();


    compartilhar.style.display =
        "none";


    parar.style.display =
        "inline-block";


    const temAudio =
        streamLocal
            .getAudioTracks()
            .length >
        0;


    statusTexto.innerText =
        temAudio
            ? "🟢 Transmitindo vídeo + áudio do aplicativo"
            : "🟢 Transmitindo vídeo";


    if (
        trackVideo
    ) {

        trackVideo.onended =
            pararTransmissao;

    }

}


// ==========================================================
// PEER CONNECTION
// ==========================================================

function criarPeer() {

    if (
        peer
    ) {

        peer.close();

    }


    candidatosPendentes =
        [];


    peer =
        new RTCPeerConnection(
            configuracaoWebRTC
        );


    peer.onicecandidate =
    evento => {

        if (
            evento.candidate
        ) {

            socket.emit(
                "ice-candidate",
                {

                    sala:
                        sala,

                    candidate:
                        evento.candidate

                }
            );

        }

    };


    peer.ontrack =
    evento => {

        video.srcObject =
            evento.streams[0];


        ativarSom.style.display =
            "inline-block";


        video.muted =
            true;


        ativarSom.innerText =
            "🔇 Mutado";


        statusTexto.innerText =
            "🟢 Recebendo transmissão";


        video.play()
            .catch(
                () => {

                    statusTexto.innerText =
                        "Clique em Ativar som.";

                }
            );

    };


    peer.onconnectionstatechange =
    () => {

        console.log(
            "WebRTC:",
            peer.connectionState
        );


        if (
            peer.connectionState ===
            "connected"
        ) {

            statusTexto.innerText =
                souTransmissor
                    ? (
                        streamLocal
                        &&
                        streamLocal
                            .getAudioTracks()
                            .length >
                        0
                            ? "🟢 Transmitindo vídeo + áudio"
                            : "🟢 Transmitindo vídeo"
                    )
                    : "🟢 Conectado";

        }


        if (
            peer.connectionState ===
            "failed"
        ) {

            statusTexto.innerText =
                "Falha na conexão da transmissão.";

        }

    };

}


// ==========================================================
// OFFER
// ==========================================================

async function enviarOffer() {

    if (
        !peer
    ) {

        return;

    }


    const offer =
        await peer.createOffer();


    await peer
        .setLocalDescription(
            offer
        );


    socket.emit(
        "offer",
        {

            sala:
                sala,

            offer:
                offer

        }
    );

}


// ==========================================================
// VIEWER ENTROU
// ==========================================================

socket.on(
    "usuario-entrou",
    async () => {

        if (
            souTransmissor
            &&
            streamLocal
            &&
            peer
        ) {

            await enviarOffer();

        }

    }
);


// ==========================================================
// RECEBER OFFER
// ==========================================================

socket.on(
    "offer",
    async offer => {

        if (
            souTransmissor
        ) {

            return;

        }


        criarPeer();


        await peer
            .setRemoteDescription(
                new RTCSessionDescription(
                    offer
                )
            );


        await adicionarPendentes();


        const answer =
            await peer.createAnswer();


        await peer
            .setLocalDescription(
                answer
            );


        socket.emit(
            "answer",
            {

                sala:
                    sala,

                answer:
                    answer

            }
        );

    }
);


// ==========================================================
// RECEBER ANSWER
// ==========================================================

socket.on(
    "answer",
    async answer => {

        if (
            !peer
        ) {

            return;

        }


        await peer
            .setRemoteDescription(
                new RTCSessionDescription(
                    answer
                )
            );


        await adicionarPendentes();

    }
);


// ==========================================================
// ICE
// ==========================================================

socket.on(
    "ice-candidate",
    async candidate => {

        if (
            !candidate
        ) {

            return;

        }


        if (
            !peer
            ||
            !peer.remoteDescription
        ) {

            candidatosPendentes
                .push(
                    candidate
                );


            return;

        }


        try {

            await peer
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        }
        catch (
            erro
        ) {

            console.error(
                "ICE:",
                erro
            );

        }

    }
);


async function adicionarPendentes() {

    if (
        !peer
    ) {

        return;

    }


    for (
        const candidato
        of candidatosPendentes
    ) {

        try {

            await peer
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidato
                    )
                );

        }
        catch (
            erro
        ) {

            console.error(
                erro
            );

        }

    }


    candidatosPendentes =
        [];

}


// ==========================================================
// BOTÃO SOM DO VIEWER
// ==========================================================

ativarSom.onclick =
async () => {

    video.muted =
        !video.muted;


    if (
        video.muted
    ) {

        ativarSom.innerText =
            "🔇 Mutado";


        return;

    }


    try {

        await video.play();


        ativarSom.innerText =
            "🔊 Som ligado";


        statusTexto.innerText =
            "🟢 Assistindo transmissão";

    }
    catch (
        erro
    ) {

        console.error(
            erro
        );


        video.muted =
            true;


        ativarSom.innerText =
            "🔇 Mutado";

    }

};


// ==========================================================
// PARAR TRANSMISSÃO
// ==========================================================

parar.onclick =
    pararTransmissao;


async function pararTransmissao() {

    /*
    Primeiro para o helper nativo.
    */

    await encerrarAudioNativo(
        true
    );


    if (
        streamLocal
    ) {

        streamLocal
            .getTracks()
            .forEach(
                track => {

                    try {

                        track.stop();

                    }
                    catch {
                    }

                }
            );


        streamLocal =
            null;

    }


    if (
        peer
    ) {

        peer.close();


        peer =
            null;

    }


    video.srcObject =
        null;


    if (
        sala
    ) {

        socket.emit(
            "encerrar-transmissao",
            sala
        );

    }


    parar.style.display =
        "none";


    if (
        souTransmissor
    ) {

        compartilhar.style.display =
            "inline-block";

    }


    statusTexto.innerText =
        "Transmissão encerrada.";

}


socket.on(
    "transmissao-encerrada",
    () => {

        video.srcObject =
            null;


        video.muted =
            true;


        ativarSom.innerText =
            "🔇 Mutado";


        statusTexto.innerText =
            "A transmissão foi encerrada.";

    }
);


// ==========================================================
// TELA CHEIA
// ==========================================================

telaCheia.onclick =
async () => {

    try {

        if (
            video.requestFullscreen
        ) {

            await video
                .requestFullscreen();

        }
        else if (
            video.webkitRequestFullscreen
        ) {

            video
                .webkitRequestFullscreen();

        }

    }
    catch (
        erro
    ) {

        console.error(
            erro
        );

    }

};


// ==========================================================
// FECHAR SELETOR
// ==========================================================

document
    .getElementById(
        "fecharSeletor"
    )
    .onclick =
() => {

    modalFontes.style.display =
        "none";

};


// ==========================================================
// LIMPEZA AO FECHAR
// ==========================================================

window.addEventListener(
    "beforeunload",
    () => {

        if (
            estouNoElectron
            &&
            window.electronAPI
                .pararAudioAplicativo
        ) {

            window.electronAPI
                .pararAudioAplicativo()
                .catch(
                    () => {}
                );

        }

    }
);

</script>
