<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Compartilhar Tela</title>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f0f0f;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    padding: 30px;
    text-align: center;
}

h1 {
    margin-bottom: 8px;
}

.subtitulo {
    color: #aaa;
    margin-bottom: 30px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    margin: 5px;
    font-size: 16px;
    cursor: pointer;
}

#criar {
    background: #23a559;
    color: white;
}

#compartilhar {
    background: #5865f2;
    color: white;
}

#parar {
    background: #da373c;
    color: white;
}

#copiar,
#telaCheia,
#ativarSom {
    background: #404249;
    color: white;
}

#linkBox {
    display: none;
    background: #1e1f22;
    padding: 20px;
    border-radius: 12px;
    max-width: 700px;
    margin: 20px auto;
}

#linkSala {
    color: #b5bac1;
    word-break: break-all;
}

#status {
    color: #b5bac1;
    margin: 20px;
}

.botoes {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 5px;
}

.video-container {
    width: 100%;
    background: black;
    border: 1px solid #333;
    border-radius: 12px;
    overflow: hidden;
    margin-top: 20px;
}

video {
    width: 100%;
    display: block;
    background: black;
    aspect-ratio: 16 / 9;
    object-fit: contain;
}


/* MODAL */

#modalFontes {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.8);
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.modal-conteudo {
    width: min(1000px, 94vw);
    max-height: 88vh;
    overflow-y: auto;
    background: #1e1f22;
    padding: 25px;
    border-radius: 15px;
}

#listaFontes {
    display: grid;
    grid-template-columns:
        repeat(
            auto-fill,
            minmax(220px, 1fr)
        );
    gap: 15px;
    margin: 20px 0;
}

.fonte {
    background: #2b2d31;
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 10px;
    cursor: pointer;
}

.fonte:hover {
    border-color: #5865f2;
}

.fonte img {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: contain;
    background: black;
    border-radius: 7px;
}

.fonte-nome {
    margin-top: 8px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.configuracoes {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
}

.config {
    background: #2b2d31;
    padding: 12px;
    border-radius: 8px;
}

select {
    background: #111214;
    color: white;
    border: 1px solid #555;
    padding: 7px;
    border-radius: 5px;
}

</style>

</head>


<body>


<div class="container">

<h1>
    🖥️ Compartilhar Tela
</h1>

<p class="subtitulo">

    Compartilhamento em tempo real

</p>


<button id="criar">

    Criar sala

</button>


<div id="linkBox">

    <h3>
        Sala criada
    </h3>

    <p>
        Código:
        <strong id="codigoSala">
        </strong>
    </p>

    <p id="linkSala">
    </p>

    <button id="copiar">
        📋 Copiar link
    </button>

</div>


<div class="botoes">

<button
    id="compartilhar"
    style="display:none;"
>
    🖥️ Compartilhar tela
</button>


<button
    id="parar"
    style="display:none;"
>
    ⏹ Parar transmissão
</button>


<button id="telaCheia">
    ⛶ Tela cheia
</button>


<button
    id="ativarSom"
    style="display:none;"
>
    🔊 Ativar som
</button>

</div>


<p id="status">

    Crie uma sala para começar.

</p>


<div class="video-container">

<video
    id="video"
    autoplay
    playsinline
    muted
>
</video>

</div>


</div>



<div id="modalFontes">

<div class="modal-conteudo">

<h2>
    Compartilhar sua tela
</h2>

<p>
    Escolha uma tela ou aplicativo.
</p>


<div class="configuracoes">

<div class="config">

Qualidade

<select id="qualidade">

<option value="720">
    720p
</option>

<option
    value="1080"
    selected
>
    1080p
</option>

</select>

</div>


<div class="config">

FPS

<select id="fps">

<option
    value="30"
    selected
>
    30 FPS
</option>

<option value="60">
    60 FPS
</option>

</select>

</div>


<div class="config">

<label>

<input
    type="checkbox"
    id="usarAudio"
    checked
>

Áudio do sistema

</label>

</div>

</div>


<div id="listaFontes">
</div>


<button id="fecharSeletor">

    Cancelar

</button>

</div>

</div>



<script src="/socket.io/socket.io.js"></script>


<script>


/*
==============================
SERVIDOR PÚBLICO
==============================
*/

const SERVIDOR_PUBLICO =
    "https://compartilhar-tela-ic01.onrender.com";


const estouNoElectron =
    !!window.electronAPI;


/*
No Electron usamos o Render.

No navegador do amigo,
também usamos o Render.
*/

const socket =
    io(
        SERVIDOR_PUBLICO,
        {
            transports: [
                "websocket",
                "polling"
            ]
        }
    );



const video =
    document.getElementById(
        "video"
    );

const criar =
    document.getElementById(
        "criar"
    );

const compartilhar =
    document.getElementById(
        "compartilhar"
    );

const parar =
    document.getElementById(
        "parar"
    );

const telaCheia =
    document.getElementById(
        "telaCheia"
    );

const ativarSom =
    document.getElementById(
        "ativarSom"
    );

const statusTexto =
    document.getElementById(
        "status"
    );

const linkBox =
    document.getElementById(
        "linkBox"
    );

const codigoSala =
    document.getElementById(
        "codigoSala"
    );

const linkSala =
    document.getElementById(
        "linkSala"
    );

const copiar =
    document.getElementById(
        "copiar"
    );

const modalFontes =
    document.getElementById(
        "modalFontes"
    );

const listaFontes =
    document.getElementById(
        "listaFontes"
    );


let sala = "";

let souTransmissor = false;

let streamLocal = null;

let peer = null;

let candidatosPendentes = [];



const configuracaoWebRTC = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};



socket.on(
    "connect",
    () => {

        console.log(
            "Socket conectado:",
            socket.id
        );

    }
);



socket.on(
    "connect_error",
    erro => {

        console.error(
            "Erro Socket:",
            erro
        );

        statusTexto.innerText =
            "Falha ao conectar ao servidor.";

    }
);



/*
==============================
ENTRAR PELO LINK
==============================
*/

const parametros =
    new URLSearchParams(
        window.location.search
    );


const salaDoLink =
    parametros.get(
        "sala"
    );


if (salaDoLink) {

    sala =
        salaDoLink;


    souTransmissor =
        false;


    socket.emit(
        "entrar-sala",
        sala
    );


    criar.style.display =
        "none";


    compartilhar.style.display =
        "none";


    linkBox.style.display =
        "block";


    codigoSala.innerText =
        sala;


    linkSala.innerText =
        window.location.href;


    ativarSom.style.display =
        "inline-block";


    statusTexto.innerText =
        "Aguardando transmissão...";

}



/*
==============================
CRIAR SALA
==============================
*/

criar.onclick =
() => {

    sala =
        Math.random()
            .toString(36)
            .substring(2, 8)
            .toUpperCase();


    souTransmissor =
        true;


    socket.emit(
        "entrar-sala",
        sala
    );


    codigoSala.innerText =
        sala;


    /*
    IMPORTANTE:
    o link enviado ao amigo
    sempre é o endereço público.
    */

    const linkPublico =
        SERVIDOR_PUBLICO
        + "/?sala="
        + sala;


    linkSala.innerText =
        linkPublico;


    linkBox.style.display =
        "block";


    compartilhar.style.display =
        "inline-block";


    criar.style.display =
        "none";


    statusTexto.innerText =
        "Sala criada. Envie o link para quem vai assistir.";

};



/*
==============================
COPIAR LINK
==============================
*/

copiar.onclick =
async () => {

    try {

        await navigator
            .clipboard
            .writeText(
                linkSala.innerText
            );


        copiar.innerText =
            "✅ Copiado";


        setTimeout(
            () => {

                copiar.innerText =
                    "📋 Copiar link";

            },
            1500
        );

    }
    catch {

        alert(
            linkSala.innerText
        );

    }

};



/*
==============================
COMPARTILHAR
==============================
*/

compartilhar.onclick =
async () => {

    if (
        estouNoElectron
    ) {

        await abrirSeletorElectron();

        return;

    }


    await compartilharNavegador();

};



/*
==============================
SELETOR ELECTRON
==============================
*/

async function abrirSeletorElectron() {

    modalFontes.style.display =
        "flex";


    listaFontes.innerHTML =
        "Carregando janelas...";


    try {

        const fontes =
            await window
                .electronAPI
                .listarFontes();


        listaFontes.innerHTML =
            "";


        fontes.forEach(
            fonte => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "fonte";


                card.innerHTML = `

                    <img
                        src="${fonte.thumbnail}"
                    >

                    <div class="fonte-nome">
                        ${fonte.nome}
                    </div>

                `;


                card.onclick =
                async () => {

                    await window
                        .electronAPI
                        .selecionarFonte(
                            fonte.id
                        );


                    modalFontes
                        .style
                        .display =
                        "none";


                    await iniciarElectron();

                };


                listaFontes
                    .appendChild(
                        card
                    );

            }
        );

    }
    catch (erro) {

        console.error(
            erro
        );


        listaFontes.innerHTML =
            "Erro ao carregar janelas.";

    }

}



/*
==============================
CAPTURA ELECTRON
==============================
*/

async function iniciarElectron() {

    try {

        const qualidade =
            Number(
                document
                    .getElementById(
                        "qualidade"
                    )
                    .value
            );


        const fps =
            Number(
                document
                    .getElementById(
                        "fps"
                    )
                    .value
            );


        const audio =
            document
                .getElementById(
                    "usarAudio"
                )
                .checked;


        const largura =
            qualidade === 1080
                ? 1920
                : 1280;


        const altura =
            qualidade === 1080
                ? 1080
                : 720;


        streamLocal =
            await navigator
                .mediaDevices
                .getDisplayMedia({

                    video: {

                        width: {
                            ideal:
                                largura
                        },

                        height: {
                            ideal:
                                altura
                        },

                        frameRate: {
                            ideal:
                                fps,
                            max:
                                fps
                        }

                    },

                    audio:
                        audio

                });


        await prepararTransmissao();

    }
    catch (erro) {

        console.error(
            erro
        );


        statusTexto.innerText =
            "Não foi possível iniciar a transmissão.";

    }

}



/*
==============================
NAVEGADOR
==============================
*/

async function compartilharNavegador() {

    try {

        streamLocal =
            await navigator
                .mediaDevices
                .getDisplayMedia({

                    video: {

                        width: {
                            ideal: 1920
                        },

                        height: {
                            ideal: 1080
                        },

                        frameRate: {
                            ideal: 30,
                            max: 30
                        }

                    },

                    audio:
                        true

                });


        await prepararTransmissao();

    }
    catch (erro) {

        console.error(
            erro
        );


        statusTexto.innerText =
            "Compartilhamento cancelado.";

    }

}



/*
==============================
INICIAR WEBRTC
==============================
*/

async function prepararTransmissao() {

    video.muted =
        true;


    video.srcObject =
        streamLocal;


    const trackVideo =
        streamLocal
            .getVideoTracks()[0];


    if (trackVideo) {

        trackVideo.contentHint =
            "detail";

    }


    criarPeer();


    for (
        const track
        of streamLocal.getTracks()
    ) {

        const sender =
            peer.addTrack(
                track,
                streamLocal
            );


        if (
            track.kind ===
            "video"
        ) {

            try {

                const parametros =
                    sender
                        .getParameters();


                if (
                    !parametros.encodings
                    ||
                    parametros
                        .encodings
                        .length === 0
                ) {

                    parametros.encodings =
                        [{}];

                }


                parametros
                    .encodings[0]
                    .maxBitrate =
                    8000000;


                await sender
                    .setParameters(
                        parametros
                    );

            }
            catch {

                console.log(
                    "Bitrate automático."
                );

            }

        }

    }


    await enviarOffer();


    compartilhar.style.display =
        "none";


    parar.style.display =
        "inline-block";


    statusTexto.innerText =
        "🟢 Transmitindo";


    if (trackVideo) {

        trackVideo.onended =
            pararTransmissao;

    }

}



/*
==============================
CRIAR PEER
==============================
*/

function criarPeer() {

    if (peer) {

        peer.close();

    }


    candidatosPendentes =
        [];


    peer =
        new RTCPeerConnection(
            configuracaoWebRTC
        );


    peer.onicecandidate =
    evento => {

        if (
            evento.candidate
        ) {

            socket.emit(
                "ice-candidate",
                {

                    sala:
                        sala,

                    candidate:
                        evento.candidate

                }
            );

        }

    };


    peer.ontrack =
    evento => {

        video.srcObject =
            evento.streams[0];


        ativarSom.style.display =
            "inline-block";


        statusTexto.innerText =
            "🟢 Recebendo transmissão";


        video.play()
            .catch(
                () => {

                    statusTexto.innerText =
                        "Clique em Ativar som para assistir.";

                }
            );

    };


    peer.onconnectionstatechange =
    () => {

        console.log(
            "Estado WebRTC:",
            peer.connectionState
        );


        if (
            peer.connectionState ===
            "connected"
        ) {

            statusTexto.innerText =
                souTransmissor
                    ? "🟢 Transmitindo"
                    : "🟢 Conectado";

        }


        if (
            peer.connectionState ===
            "failed"
        ) {

            statusTexto.innerText =
                "Falha na conexão WebRTC.";

        }

    };

}



/*
==============================
OFFER
==============================
*/

async function enviarOffer() {

    if (!peer)
        return;


    const offer =
        await peer
            .createOffer();


    await peer
        .setLocalDescription(
            offer
        );


    socket.emit(
        "offer",
        {

            sala:
                sala,

            offer:
                offer

        }
    );

}



/*
==============================
VIEWER ENTROU
==============================
*/

socket.on(
    "usuario-entrou",
    async () => {

        if (
            souTransmissor
            &&
            streamLocal
            &&
            peer
        ) {

            await enviarOffer();

        }

    }
);



/*
==============================
RECEBER OFFER
==============================
*/

socket.on(
    "offer",
    async offer => {

        if (
            souTransmissor
        )
            return;


        criarPeer();


        await peer
            .setRemoteDescription(
                new RTCSessionDescription(
                    offer
                )
            );


        await adicionarPendentes();


        const answer =
            await peer
                .createAnswer();


        await peer
            .setLocalDescription(
                answer
            );


        socket.emit(
            "answer",
            {

                sala:
                    sala,

                answer:
                    answer

            }
        );

    }
);



/*
==============================
RECEBER ANSWER
==============================
*/

socket.on(
    "answer",
    async answer => {

        if (!peer)
            return;


        await peer
            .setRemoteDescription(
                new RTCSessionDescription(
                    answer
                )
            );


        await adicionarPendentes();

    }
);



/*
==============================
ICE
==============================
*/

socket.on(
    "ice-candidate",
    async candidate => {

        if (!candidate)
            return;


        if (
            !peer
            ||
            !peer.remoteDescription
        ) {

            candidatosPendentes
                .push(
                    candidate
                );

            return;

        }


        try {

            await peer
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidate
                    )
                );

        }
        catch (erro) {

            console.error(
                "Erro ICE:",
                erro
            );

        }

    }
);



async function adicionarPendentes() {

    if (!peer)
        return;


    for (
        const candidato
        of candidatosPendentes
    ) {

        try {

            await peer
                .addIceCandidate(
                    new RTCIceCandidate(
                        candidato
                    )
                );

        }
        catch (erro) {

            console.error(
                erro
            );

        }

    }


    candidatosPendentes =
        [];

}



/*
==============================
ATIVAR SOM
==============================
*/

ativarSom.onclick =
async () => {

    video.muted =
        false;


    try {

        await video.play();


        ativarSom.innerText =
            "🔊 Som ligado";


        statusTexto.innerText =
            "🟢 Assistindo transmissão";

    }
    catch (erro) {

        console.error(
            erro
        );

    }

};



/*
==============================
PARAR
==============================
*/

parar.onclick =
    pararTransmissao;


function pararTransmissao() {

    if (
        streamLocal
    ) {

        streamLocal
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );


        streamLocal =
            null;

    }


    if (peer) {

        peer.close();

        peer =
            null;

    }


    video.srcObject =
        null;


    socket.emit(
        "encerrar-transmissao",
        sala
    );


    parar.style.display =
        "none";


    if (
        souTransmissor
    ) {

        compartilhar.style.display =
            "inline-block";

    }


    statusTexto.innerText =
        "Transmissão encerrada.";

}



socket.on(
    "transmissao-encerrada",
    () => {

        video.srcObject =
            null;


        statusTexto.innerText =
            "A transmissão foi encerrada.";

    }
);



/*
==============================
TELA CHEIA
==============================
*/

telaCheia.onclick =
async () => {

    try {

        if (
            video.requestFullscreen
        ) {

            await video
                .requestFullscreen();

        }

        else if (
            video.webkitRequestFullscreen
        ) {

            video
                .webkitRequestFullscreen();

        }

    }
    catch (erro) {

        console.error(
            erro
        );

    }

};



document
    .getElementById(
        "fecharSeletor"
    )
    .onclick =
() => {

    modalFontes.style.display =
        "none";

};


</script>


</body>

</html>
